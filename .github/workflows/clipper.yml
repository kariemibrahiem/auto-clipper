name: Make Vertical Clips
run-name: clip-${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Unique job identifier from n8n
        required: true
        type: string
      source_url:
        description: Public downloadable HTTPS MP4 (or supported platform URL) with reuse rights
        required: true
        type: string
      source_is_direct:
        description: Treat source_url as a directly downloadable media file
        required: false
        default: 'false'
        type: string
      start_seconds:
        description: Optional offset in the long source video (0 by default)
        required: false
        default: '0'
        type: string
      analysis_seconds:
        description: Window to analyze (60 to 2700 seconds; 1800 by default)
        required: false
        default: '1800'
        type: string
      clip_count:
        description: Number of vertical clips (1 to 5)
        required: true
        default: '3'
        type: string
      clip_seconds:
        description: Length of each clip in seconds (15 to 55)
        required: true
        default: '35'
        type: string
      language:
        description: Narration language (auto, ar, en)
        required: true
        default: auto
        type: string
      narration:
        description: Add an automatically generated voiceover (on, off)
        required: true
        default: 'on'
        type: string

permissions:
  contents: read

jobs:
  make-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      JOB_ID: ${{ inputs.job_id }}
      SOURCE_URL: ${{ inputs.source_url }}
      SOURCE_IS_DIRECT: ${{ inputs.source_is_direct }}
      START_SECONDS: ${{ inputs.start_seconds }}
      ANALYSIS_SECONDS: ${{ inputs.analysis_seconds }}
      CLIP_COUNT: ${{ inputs.clip_count }}
      CLIP_SECONDS: ${{ inputs.clip_seconds }}
      LANGUAGE: ${{ inputs.language }}
      NARRATION: ${{ inputs.narration }}
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JavaScript for YouTube extraction
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Produce short videos
        run: python clipper.py

      - name: Publish clips to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ inputs.job_id }}
          path: outputs/
          if-no-files-found: error
          retention-days: 3
